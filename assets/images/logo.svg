<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2552;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="48" fill="url(#grad1)" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Shield / Crest Center -->
    <polygon points="50,18 78,32 78,64 50,82 22,64 22,32" fill="#ffffff" opacity="0.15"/>
    
    <!-- Academic Cap / Tech Icon -->
    <!-- Graduation Cap -->
    <path d="M 50 30 L 72 40 L 50 50 L 28 40 Z" fill="url(#goldGrad)"/>
    <polygon points="40,46 40,56 60,56 60,46 50,51" fill="#fbbf24"/>
    <path d="M 72 40 L 74 58 L 71 58 Z" fill="#ffffff"/>

    <!-- Open Book -->
    <path d="M 32 62 Q 50 58 50 68 Q 50 58 68 62 L 68 76 Q 50 72 50 82 Q 50 72 32 76 Z" fill="#ffffff"/>
    <line x1="50" y1="68" x2="50" y2="82" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Laurel Wreath hints -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- College Branding Text -->
  <g transform="translate(125, 22)">
    <!-- College Name -->
    <text x="0" y="32" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#0f2b5c" letter-spacing="0.5">
      GNANAMANI
    </text>
    <text x="0" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a" letter-spacing="0.8">
      COLLEGE OF TECHNOLOGY
    </text>
    <text x="0" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.2">
      QUESTION PAPER PORTAL • EXCELLENCE IN EDUCATION
    </text>
    <!-- Gold accent underline -->
    <rect x="0" y="86" width="350" height="3.5" rx="1.75" fill="url(#goldGrad)" />
  </g>
</svg>
